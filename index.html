<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2a3a">
<title>유빈의 원리책 — 위험물산업기사</title>
<meta name="description" content="위험물산업기사를 암기가 아니라 원리로 공부하기 위한 학습 페이지. 원리책 · 기출 원리 분류 연습 · 진로 지도">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1b2430; --muted:#5b6672; --line:#e1e6eb;
  --accent:#c2410c; --accent-soft:#fff1e8; --blue:#1d4ed8; --blue-soft:#e8efff;
  --green:#15803d; --green-soft:#e6f6ec; --amber:#b45309; --amber-soft:#fff7e0;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111820; --card:#1a2330; --ink:#e8edf2; --muted:#9aa7b4; --line:#2a3644;
    --accent:#fb923c; --accent-soft:#3a2416; --blue:#93b4ff; --blue-soft:#1d2a45;
    --green:#4ade80; --green-soft:#16301f; --amber:#fbbf24; --amber-soft:#3a2f10;
    --shadow:0 1px 2px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;font-size:16px;word-break:keep-all}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
header{background:#1c2a3a;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hwrap{max-width:820px;margin:0 auto}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
header h1 small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:2px}
nav{display:flex;gap:6px;margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
nav button.on{background:#fff;color:#1c2a3a;border-color:#fff}
main{max-width:820px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:18px;margin:0 0 6px}
h3{font-size:16px;margin:0}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.chap .id{flex:0 0 40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
.chap .t{flex:1;min-width:0}
.chap .t b{display:block;font-size:16px}
.chap .t span{display:block;font-size:13px;color:var(--muted)}
.chap .n{font-size:13px;color:var(--muted);white-space:nowrap}
.back{background:none;border:0;color:var(--blue);padding:0;margin-bottom:10px;font-weight:600}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.pcard .head{width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.pcard .head .pid{color:var(--accent);font-weight:800;flex:0 0 auto}
.pcard .head .pt{flex:1;font-weight:700;font-size:16px}
.pcard .head .st{flex:0 0 auto;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.pcard .head .st.read{background:var(--amber-soft);color:var(--amber)}
.pcard .head .st.done{background:var(--green-soft);color:var(--green)}
.pcard .body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.pcard.open .body{display:block}
.sec{margin-top:14px}
.sec .lab{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.why{font-size:16px;line-height:1.75}
.why.big{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 14px;border-radius:0 10px 10px 0}
ul.keys{margin:0;padding-left:18px}
ul.keys li{margin:4px 0;font-size:15px}
.check{background:var(--blue-soft);border-radius:10px;padding:12px 14px;font-size:15px}
.check b{color:var(--blue)}
.memo{background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:14px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent}
.btn.on{outline:2px solid var(--green);outline-offset:1px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);margin-right:4px}
.q{font-size:17px;font-weight:600;line-height:1.6}
.choices{display:grid;gap:8px;margin-top:12px}
.choices button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;font-size:15px}
.choices button.right{border-color:var(--green);background:var(--green-soft)}
.choices button.wrong{border-color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.grid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 8px;font-size:14px;text-align:left;line-height:1.35}
.grid button b{display:block;color:var(--accent)}
.grid button.right{border-color:var(--green);background:var(--green-soft)}
.grid button.wrong{border-color:var(--accent);background:var(--accent-soft)}
.res{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--blue-soft);font-size:15px}
.stat{display:flex;gap:12px;flex-wrap:wrap}
.stat div{flex:1 1 120px;background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.path{position:relative;padding-left:22px}
.path:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.step{position:relative;margin-bottom:14px}
.step:before{content:"";position:absolute;left:-19px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.step b{display:block}
.combo{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.combo span{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:600}
.combo span.new{background:var(--green-soft);color:var(--green)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
footer{max-width:820px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2a3a;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.toast.show{opacity:1}
.chap.locked{opacity:.75}
.chap.locked .id{background:var(--line);color:var(--muted)}
.chap.cleared .id{background:var(--green-soft);color:var(--green)}
.lockbox{border-left:4px solid var(--amber);background:var(--amber-soft)}
.okbox{border-left:4px solid var(--green);background:var(--green-soft)}
.ptitle{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ptitle:last-child{border-bottom:0}
.ptitle .pid{color:var(--accent);font-weight:800;margin-right:6px}
.tag.done{background:var(--green-soft);color:var(--green);font-weight:600;vertical-align:middle}
.lab{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.flash{position:relative;min-height:170px;margin-top:10px;cursor:pointer}
.flash .face{border-radius:12px;padding:16px;min-height:170px;display:flex;flex-direction:column;justify-content:center}
.flash .front{background:var(--blue-soft);border:1px solid var(--line)}
.flash .back{display:none;background:var(--amber-soft);border:1px solid var(--line)}
.flash.flipped .front{display:none}
.flash.flipped .back{display:flex}
.ftext{font-size:18px;font-weight:600;line-height:1.5}
.vid{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--bg)}
.vid .vico{flex:0 0 28px;height:28px;border-radius:8px;background:#e53935;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.vid .vt{flex:1;min-width:0;font-size:14px;line-height:1.45}
.vid .vt b{display:block;color:var(--blue)}
.vid .vt span{display:block;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1>유빈의 원리책 <small>위험물산업기사 — 외우지 말고, 왜 그런지 하나씩</small></h1>
  <nav id="nav">
    <button data-view="home">시작</button>
    <button data-view="book">원리책</button>
    <button data-view="quiz">원리 분류 연습</button>
    <button data-view="numbers">숫자 붙이기</button>
    <button data-view="career">진로 지도</button>
    <button data-view="mine">내 기록</button>
  </nav>
</div></header>
<main id="main"></main>
<footer>이 페이지의 수치와 규정은 학습용 정리입니다. 시험 접수·출제기준·법령 개정 사항은 <a href="https://www.q-net.or.kr" target="_blank" rel="noopener">큐넷(Q-Net)</a>과 사용하는 교재에서 확인하세요.</footer>
<div class="toast" id="toast"></div>

<script src="data-principles.js"></script>
<script src="data-quiz.js"></script>
<script>
// ---------- 저장 (localStorage) ----------
const STORE_KEY = "yubin.v2";
let S = { status:{}, notes:{}, pass:{}, exam:{}, cards:{}, numq:{done:0,right:0}, quiz:{ done:0, principleRight:0, answerRight:0, seen:{} } };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
S.cards = S.cards||{}; S.numq = S.numq||{done:0,right:0};
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }

const ALL = []; CHAPTERS.forEach(c=>c.principles.forEach(p=>{ p.chapter=c; ALL.push(p); }));
const byId = id => ALL.find(p=>p.id===id);
const chapOf = id => CHAPTERS.find(c=>c.id===id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function linkify(s){ return esc(s).replace(/\b([A-N][1-8])\b/g,(m)=> byId(m)?`<a href="#book/${m}">${m}</a>`:m); }
const PASS_RATIO = 0.8;

// ---------- 진도·잠금 ----------
function progressOf(ch){ const n=ch.principles.length, d=ch.principles.filter(p=>S.status[p.id]==="done").length, r=ch.principles.filter(p=>S.status[p.id]).length; return {n,d,r,allDone:d===n}; }
function progressAll(){ const d=ALL.filter(p=>S.status[p.id]==="done").length; return {n:ALL.length, d, pct:Math.round(d/ALL.length*100)}; }
function isCleared(ch){ return progressOf(ch).allDone && !!S.pass[ch.id]; }
function isUnlocked(ch){ const i=CHAPTERS.indexOf(ch); return i===0 || isCleared(CHAPTERS[i-1]); }
function currentChapter(){ return CHAPTERS.find(c=>isUnlocked(c) && !isCleared(c)) || CHAPTERS[CHAPTERS.length-1]; }
function lockReason(ch){ const i=CHAPTERS.indexOf(ch); const prev=CHAPTERS[i-1]; const pr=progressOf(prev);
  const need=[]; if(!pr.allDone) need.push(`${prev.id} 단원의 원리 ${pr.n}개 중 ${pr.n-pr.d}개를 더 "설명할 수 있음"으로`); if(!S.pass[prev.id]) need.push(`${prev.id} 단원 통과 시험(${Math.round(PASS_RATIO*100)}% 이상)`);
  return `앞 단원 <b>${prev.id}. ${esc(prev.title)}</b>을 마치면 열린다: ` + need.join(", ") + ".";
}

// ---------- 라우팅 ----------
const main = document.getElementById("main");
function route(){
  const h = location.hash.replace(/^#/,"") || "home";
  const [view, arg] = h.split("/");
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.view===view));
  ({home, book, quiz, career, mine, exam, numbers, numq}[view] || home)(arg);
  window.scrollTo({top:0});
}
document.getElementById("nav").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) location.hash=b.dataset.view; });
window.addEventListener("hashchange", route);

// ---------- 시작 ----------
function home(){
  const pa = progressAll(), cur = currentChapter(), pr = progressOf(cur), cleared = CHAPTERS.filter(isCleared).length;
  main.innerHTML = `
  <div class="card">
    <h2>이 페이지를 쓰는 법</h2>
    <p>자격증 공부를 "무조건 외우기"로 하면 지겹고, 진도가 안 나가고, 결국 지친다. 이 페이지는 반대로 간다. 시험에 나오는 내용 뒤에 있는 <b>원리</b>를 하나씩 정확히 익혀서, 나중에는 스스로 <b>자기 원리책</b>을 쓸 수 있게 되는 것이 목표다. 시간이 더 걸려도 괜찮다.</p>
    <div class="path">
      <div class="step"><b>1. 열려 있는 단원의 원리를 하나 읽는다</b><span class="muted small">"왜 그런가"를 이해할 때까지. 숫자는 나중에.</span></div>
      <div class="step"><b>2. 내 말로 다시 쓴다</b><span class="muted small">각 원리 아래 메모 칸에 남에게 설명하듯 적는다. 막히는 곳이 아직 모르는 곳이다.</span></div>
      <div class="step"><b>3. "설명할 수 있음"에 체크한다</b><span class="muted small">아빠나 친구에게 실제로 설명해 보고 체크하면 가장 좋다.</span></div>
      <div class="step"><b>4. 단원 통과 시험을 본다</b><span class="muted small">단원의 원리를 모두 체크하면 통과 시험이 열린다. ${Math.round(PASS_RATIO*100)}% 이상 맞히면 다음 단원이 열린다. 원리가 진짜 내 것이 됐는지 확인하는 관문이다. 숫자를 묻는 문제는 없다.</span></div>
      <div class="step"><b>5. 통과한 단원의 숫자를 뼈대에 붙인다</b><span class="muted small">지정수량·거리·용량 같은 숫자는 원리로 환원되지 않아 결국 외워야 한다. 하지만 순서가 있다. 단원을 통과한 뒤 "숫자 붙이기"에서 카드 앞면(원리)을 보고 뒷면(숫자)을 떠올린다. 모든 단원을 마치면 숫자 총복습이 열린다.</span></div>
    </div>
  </div>
  <div class="card">
    <h2>지금 공부할 단원</h2>
    <button class="chap" onclick="location.hash='book/${cur.id}'"><span class="id">${cur.id}</span><span class="t"><b>${esc(cur.title)}</b><span>${esc(cur.subtitle)}</span></span><span class="n">${pr.d}/${pr.n}</span></button>
    <div class="stat">
      <div><b>${cleared} / ${CHAPTERS.length}</b><span>통과한 단원</span></div>
      <div><b>${pa.d} / ${pa.n}</b><span>설명할 수 있는 원리</span></div>
      <div><b>${S.quiz.done}</b><span>분류 연습 푼 문제</span></div>
    </div>
    <div class="progress"><i style="width:${pa.pct}%"></i></div>
  </div>
  <div class="card">
    <h2>시험의 구조 (알고 시작하기)</h2>
    <p class="small">필기는 3과목(물질의 물리·화학적 성질 / 화재예방과 소화방법 / 위험물 성상 및 취급) 각 20문항, 과목당 40점 이상·평균 60점 이상이면 합격. 실기는 필답형 20문항(2시간) 60점 이상. 즉 <b>모든 문제를 맞힐 필요가 없다</b> — 원리를 잡은 영역에서 확실히 맞히고, 순수 암기 숫자는 마지막에 붙이면 된다.</p>
    <p class="small muted">화학 용어는 에듀윌 교재와 최근 시험지가 쓰는 새 표기(다이에틸에터·아세트알데하이드·나이트로·아이오딘값·할로젠 등)를 따랐고, 옛 표기(디에틸에테르·니트로·요오드값 등)는 처음 나올 때 괄호로 함께 적었다.</p>
    <p class="small muted">원리책은 위 3과목을 A(연소)·B(소화)·C·D(화학)·E(소화설비)·F~K(1~6류)·L~N(법규) 14개 단원 ${ALL.length}개 원리로 다시 묶은 것이고, 숫자 카드 ${ALLCARDS.length}장이 그 원리들에 매달려 있다. 앞 단원이 뒤 단원의 근거가 되도록 배열했고, 그래서 앞 단원을 마쳐야 다음 단원이 열린다.</p>
  </div>`;
}

// ---------- 원리책 ----------
function book(arg){
  if (arg){ const p = byId(arg); if (p) return chapterView(p.chapter, p.id); const c = chapOf(arg); if (c) return chapterView(c); }
  const pa = progressAll();
  main.innerHTML = `<div class="card"><h2>원리책 목차</h2><p class="small muted">전체 ${CHAPTERS.length}단원 ${ALL.length}원리. 앞 단원을 통과해야 다음 단원이 열린다. 잠긴 단원도 제목과 원리 목록은 볼 수 있다.</p><div class="progress"><i style="width:${pa.pct}%"></i></div><div class="small muted" style="margin-top:4px">${pa.d}/${pa.n} 원리 설명 가능 · ${CHAPTERS.filter(isCleared).length}/${CHAPTERS.length} 단원 통과</div></div>` +
  CHAPTERS.map(c=>{ const pr=progressOf(c), un=isUnlocked(c), cl=isCleared(c);

// ---------- 단원 통과 시험 ----------
let X = null;
function exam(cid){
  const c = chapOf(cid); if(!c) return book();
  if (!isUnlocked(c) || !progressOf(c).allDone) return chapterView(c);
  const items = QUIZ.map((q,i)=>i).filter(i=>QUIZ[i].type==='principle' && byId(QUIZ[i].principle).chapter===c).sort(()=>Math.random()-0.5);
  X = { c, items, k:0, right:0, picked:null };
  renderX();
}
function renderX(){
  const {c, items, k} = X; const n = items.length;
  if (k >= n){
    const passed = X.right/n >= PASS_RATIO;
    const best = S.exam[c.id]; if(!best || X.right>best.right) S.exam[c.id]={right:X.right,n};
    if (passed) S.pass[c.id]=true; save();
    const next = CHAPTERS[CHAPTERS.indexOf(c)+1];
    main.innerHTML = `<div class="card ${passed?"okbox":"lockbox"}"><h2>${passed?"통과":"아직"} — ${X.right}/${n} (${Math.round(X.right/n*100)}%)</h2>
      <p class="small">${passed?(next?`다음 단원 <b>${next.id}. ${esc(next.title)}</b>이 열렸다.`:"마지막 단원까지 통과했다."):`통과 기준은 ${Math.round(PASS_RATIO*100)}%. 틀린 문제의 원리를 다시 읽고 설명해 본 뒤 다시 보자. 문제가 아니라 원리가 목표다.`}</p>
      <div class="row">${passed&&next?`<a class="btn primary" href="#book/${next.id}" style="text-decoration:none">${next.id} 단원으로</a>`:""}<a class="btn" href="#book/${c.id}" style="text-decoration:none">${c.id} 단원으로</a><button class="btn" onclick="location.hash='exam/${c.id}';exam('${c.id}')">다시 보기</button></div></div>`;
    return;
  }
  const it = QUIZ[items[k]], p = byId(it.principle), picked = X.picked;
  main.innerHTML = `<div class="card"><div class="small muted">${c.id} 단원 통과 시험 · ${k+1} / ${n} · 맞힘 ${X.right}</div><div class="q">${esc(it.q)}</div>
    <div class="choices">${it.choices.map((ch,i)=>`<button ${picked!==null?"disabled":""} onclick="pickX(${i})" class="${picked!==null?(i===it.answer?"right":(picked===i?"wrong":"")):""}">${i+1}. ${esc(ch)}</button>`).join("")}</div>
    ${picked!==null?`<div class="sec"><div class="lab">원리 해설 — <a href="#book/${p.id}">${p.id} ${esc(p.title)}</a></div><div class="why big">${linkify(it.why)}</div></div><div class="row"><button class="btn primary" onclick="nextX()">${k+1<n?"다음":"결과 보기"}</button></div>`:""}
  </div>`;
}
function pickX(i){ if(X.picked!==null) return; X.picked=i; if(i===QUIZ[X.items[X.k]].answer) X.right++; renderX(); }
function nextX(){ X.k++; X.picked=null; renderX(); }

// ---------- 원리 분류 연습 (열린 단원 범위) ----------
let Q = null;
function quiz(){
  const open = CHAPTERS.filter(isUnlocked);
  const pool = QUIZ.filter(q=>q.type==='principle' && open.includes(byId(q.principle).chapter));
  const seen = Object.keys(S.quiz.seen).filter(i=>QUIZ[i].type==='principle' && open.includes(byId(QUIZ[i].principle).chapter)).length;

    <div class="stat"><div><b>${S.quiz.done}</b><span>푼 횟수</span></div><div><b>${S.quiz.done?Math.round(S.quiz.principleRight/S.quiz.done*100):0}%</b><span>원리 분류 정답률</span></div><div><b>${S.quiz.done?Math.round(S.quiz.answerRight/S.quiz.done*100):0}%</b><span>문제 정답률</span></div><div><b>${seen}/${pool.length}</b><span>본 문제</span></div></div>
    <div class="row"><button class="btn primary" onclick="nextQ()">문제 시작</button></div></div><div id="qbox"></div>`;
}
function nextQ(){
  const open = CHAPTERS.filter(isUnlocked);
  const all = QUIZ.map((q,i)=>i).filter(i=>QUIZ[i].type==='principle' && open.includes(byId(QUIZ[i].principle).chapter));
  const unseen = all.filter(i=>!S.quiz.seen[i]);
  const pool = unseen.length? unseen : all;

function renderQ(){
  const it = Q.item, p = byId(it.principle), box=document.getElementById("qbox");

function pickP(cid){ Q.pRight = (byId(Q.item.principle).chapter.id===cid); Q.stage=2; renderQ(); }
function pickA(k){ Q.picked=k; Q.aRight = (k===Q.item.answer); Q.stage=3;

// ---------- 숫자 붙이기 ----------
const ALLCARDS = []; ALL.forEach(p=>(p.cards||[]).forEach((cd,i)=>{ ALLCARDS.push({id:p.id+"#"+i, f:cd.f, b:cd.b, p, c:p.chapter}); }));
function cardsOf(c){ return ALLCARDS.filter(x=>x.c===c); }
function cardStat(cards){ const ok=cards.filter(x=>(S.cards[x.id]||{}).last==="ok").length, ng=cards.filter(x=>(S.cards[x.id]||{}).last==="ng").length; return {n:cards.length, ok, ng, new:cards.length-ok-ng}; }
function weightOf(card){ const st=S.cards[card.id]; if(!st) return 2; return st.last==="ng"?3:1; }
function pickWeighted(cards, k){ const pool=cards.map(c=>({c,w:weightOf(c)})); const out=[]; while(out.length<k && pool.length){ const tot=pool.reduce((a,x)=>a+x.w,0); let r=Math.random()*tot, i=0; for(;i<pool.length;i++){ r-=pool[i].w; if(r<=0) break; } out.push(pool.splice(Math.min(i,pool.length-1),1)[0].c); } return out; }
function numbers(arg){

  if (arg){ const c=chapOf(arg); if(c && isCleared(c)){ const cards=cardsOf(c); const ng=cards.filter(x=>(S.cards[x.id]||{}).last==="ng"), rest=cards.filter(x=>(S.cards[x.id]||{}).last!=="ng"); return cardSession(ng.concat(rest), `${c.id} 단원 숫자 붙이기`, `#book/${c.id}`, c); } }
  const tot = cardStat(ALLCARDS), cl = cardStat(ALLCARDS.filter(x=>isCleared(x.c)));
  main.innerHTML = `<div class="card"><h2>숫자 붙이기</h2>
    <p class="small">원리로 환원되지 않는 숫자(지정수량·거리·용량·기한)는 결국 외워야 한다. 하지만 <b>뼈대를 세운 뒤에</b> 붙인다. 카드 앞면은 원리 한 줄, 뒷면은 숫자다. 앞면을 보고 숫자를 떠올린 뒤 뒤집어 확인한다. 통과한 단원부터 열린다.</p>
    <div class="stat"><div><b>${cl.ok}/${cl.n}</b><span>열린 카드 중 알았다</span></div><div><b>${cl.ng}</b><span>아직</span></div><div><b>${tot.n}</b><span>전체 카드</span></div><div><b>${S.numq.done?Math.round(S.numq.right/S.numq.done*100):0}%</b><span>숫자 문제 정답률</span></div></div>
    <div class="row">${cleared.length?`<a class="btn ${allDone?"":"primary"}" href="#numbers/mix" style="text-decoration:none">통과한 단원 섞어 복습 (20장)</a>`:""}${allDone?`<a class="btn primary" href="#numbers/all" style="text-decoration:none">숫자 총복습 (30장)</a>`:`<span class="small muted" style="align-self:center">숫자 총복습은 14단원을 모두 통과하면 열린다 (${cleared.length}/${CHAPTERS.length})</span>`}${cleared.length?`<a class="btn" href="#numq/mix" style="text-decoration:none">숫자형 문제 풀기</a>`:""}</div>
  </div>` +
  CHAPTERS.map(c=>{ const cards=cardsOf(c), st=cardStat(cards), cl=isCleared(c), nq=QUIZ.filter(q=>q.type==="number"&&byId(q.principle).chapter===c).length;
    return `<button class="chap ${cl?"":"locked"}" onclick="location.hash='${cl?"numbers/"+c.id:"book/"+c.id}'"><span class="id">${cl?c.id:"🔒"}</span><span class="t"><b>${c.id}. ${esc(c.title)}</b><span>${cl?`카드 ${cards.length}장 · 알았다 ${st.ok} · 아직 ${st.ng}${nq?` · 숫자형 문제 ${nq}개`:""}`:"단원을 통과하면 열린다"}</span></span><span class="n">${cl?Math.round(st.ok/st.n*100)+"%":""}</span></button>`; }).join("");
}
let K = null;
function cardSession(cards, title, backHash, c){ K = { cards, k:0, flipped:false, ok:0, title, backHash, c }; renderK(); }
function renderK(){
  const {cards,k} = K, n = cards.length;
  if (k>=n){ const nq = K.c? QUIZ.filter(q=>q.type==="number"&&byId(q.principle).chapter===K.c).length : 0;
    main.innerHTML = `<div class="card okbox"><h2>${esc(K.title)} — ${K.ok}/${n} 알았다</h2><p class="small">"아직"으로 남긴 카드는 다음에 먼저 나온다. 숫자는 여러 번 짧게 보는 것이 한 번 길게 보는 것보다 낫다.</p>

  const cd = cards[k], st = S.cards[cd.id];

    <div class="flash ${K.flipped?"flipped":""}" onclick="flipK()">
      <div class="face front"><div class="lab">원리 (앞면)</div><div class="ftext">${esc(cd.f)}</div><div class="small muted" style="margin-top:10px">숫자를 떠올린 뒤 눌러서 확인</div></div>
      <div class="face back"><div class="lab">숫자 (뒷면)</div><div class="ftext">${esc(cd.b)}</div></div>
    </div>
    ${K.flipped?`<div class="row"><button class="btn green" onclick="markK('ok')">알았다</button><button class="btn" onclick="markK('ng')">아직</button></div>`:`<div class="row"><button class="btn primary" onclick="flipK()">숫자 보기</button></div>`}
  </div>`;
}
function flipK(){ K.flipped=true; renderK(); }
function markK(r){ const cd=K.cards[K.k]; const st=S.cards[cd.id]||{ok:0,ng:0}; st[r]++; st.last=r; S.cards[cd.id]=st; if(r==="ok") K.ok++; save(); K.k++; K.flipped=false; renderK(); }
// 숫자형 문제 연습
let NQ = null;
function numq(arg){
  const c = chapOf(arg);
  const items = QUIZ.map((q,i)=>i).filter(i=>QUIZ[i].type==="number" && isCleared(byId(QUIZ[i].principle).chapter) && (!c || byId(QUIZ[i].principle).chapter===c)).sort(()=>Math.random()-0.5);
  if(!items.length) return numbers();
  NQ = { items, k:0, right:0, picked:null, title: c?`${c.id} 단원 숫자형 문제`:"숫자형 문제 (통과한 단원)", back: c?`#numbers/${c.id}`:"#numbers" };
  renderNQ();
}
function renderNQ(){
  const {items,k} = NQ, n = items.length;
  if (k>=n){ main.innerHTML = `<div class="card okbox"><h2>${esc(NQ.title)} — ${NQ.right}/${n}</h2><p class="small">틀린 문제는 그 원리의 카드로 돌아가 숫자를 다시 붙인다.</p><div class="row"><button class="btn primary" onclick="numq('${NQ.back.split('/')[1]||''}')">다시</button><a class="btn" href="${NQ.back}" style="text-decoration:none">돌아가기</a></div></div>`; return; }
  const it = QUIZ[items[k]], p = byId(it.principle), picked = NQ.picked;
  main.innerHTML = `<div class="card"><div class="small muted">${esc(NQ.title)} · ${k+1} / ${n} · 맞힘 ${NQ.right}</div><div class="q">${esc(it.q)}</div>
    <div class="choices">${it.choices.map((ch,i)=>`<button ${picked!==null?"disabled":""} onclick="pickNQ(${i})" class="${picked!==null?(i===it.answer?"right":(picked===i?"wrong":"")):""}">${i+1}. ${esc(ch)}</button>`).join("")}</div>
    ${picked!==null?`<div class="sec"><div class="lab">뼈대 — <a href="#book/${p.id}">${p.id} ${esc(p.title)}</a></div><div class="why big">${linkify(it.why)}</div></div><div class="row"><button class="btn primary" onclick="NQ.k++;NQ.picked=null;renderNQ()">${k+1<n?"다음":"결과 보기"}</button></div>`:""}
  </div>`;
}
function pickNQ(i){ if(NQ.picked!==null) return; NQ.picked=i; const ok=i===QUIZ[NQ.items[NQ.k]].answer; if(ok) NQ.right++; S.numq.done++; if(ok) S.numq.right++; save(); renderNQ(); }

// ---------- 진로 지도 ----------
function career(){
  main.innerHTML = `
  <div class="card"><h2>지금 가진 것과 더해질 것</h2>
    <div class="combo"><span>온수온돌기능사</span><span>용접기능사</span><span>지게차운전기능사</span><span>특수용접기능사</span><span>용접산업기사</span><span>산업안전산업기사</span><span class="new">+ 위험물산업기사</span></div>
    <p>주축은 <b>용접</b>이다. 용접기능사에서 시작해 특수용접기능사로 다루는 재료와 공법을 넓히고, 용접산업기사로 이론과 시공 관리까지 올라온 한 줄기가 "설비를 만들고 잇는 손"이다. 그 옆에서 온수온돌은 "관을 깔고 열을 돌리는 감각", 지게차는 "자재와 장비를 직접 움직이는 발", 산업안전은 "현장을 안전하게 굴리는 눈"으로 현장에서 설 수 있는 폭을 넓혀 준다. 여기에 위험물이 "그 설비 안에 흐르는 물질을 아는 머리"로 더해지면 <b>화학·정유·가스 플랜트의 설비 시공과 안전 관리</b> 양쪽에서 통하는 사람이 된다. 위험물산업기사는 새 길을 여는 자격이라기보다, 이미 가진 자격들을 하나로 묶어 주는 <b>마지막 조각</b>에 가깝다.</p>
  </div>
  <div class="card"><h2>이 조합이 통하는 자리</h2>
    <div class="path">
      <div class="step"><b>정유·석유화학·가스 플랜트 설비 (용접 시공 → 설비 관리)</b><span class="small muted">용접 기술로 들어가서, 위험물 지식으로 '무엇이 흐르는 배관·탱크를 잇고 있는가'를 아는 사람으로 자리 잡는 길. 울산·여수·대산 같은 석유화학단지와 부산·경남의 조선·플랜트 협력사에서 수요가 꾸준하다.</span></div>
      <div class="step"><b>위험물 취급 사업장의 안전관리자</b><span class="small muted">위험물안전관리법상 제조소등(주유소·저장소·화학공장 등)은 위험물안전관리자를 두어야 한다. 위험물산업기사는 취급 가능한 유별에 제한이 없는 자격으로, 산업안전산업기사와 함께 있으면 '안전 담당'으로서의 폭이 넓어진다.</span></div>
      <div class="step"><b>소방·안전 설비 분야</b><span class="small muted">화재예방·소화설비 지식은 소방설비 쪽과 겹친다. 이후 소방설비산업기사(기계)로 확장하면 용접·온수온돌에서 익힌 관 시공 감각과도 자연스럽게 이어진다.</span></div>
      <div class="step"><b>공공기관·대기업 시설직</b><span class="small muted">시설·안전 직렬 채용에서 기능사·산업기사 다수 보유는 가점 또는 응시 요건이 되는 경우가 많다. 특히 위험물·산업안전 조합을 요구하는 공고가 있다.</span></div>
    </div>
    <p class="note">※ 안전관리자 선임 요건과 채용 가점은 법령·기관마다 다르므로, 관심 있는 자리가 생기면 그 공고와 위험물안전관리법 시행령을 직접 확인한다.</p>
  </div>
  <div class="card"><h2>그 다음 단계 (순서대로가 아니라 방향으로)</h2>
    <div class="path">
      <div class="step"><b>실무 경력 쌓기</b><span class="small muted">산업기사 취득 후 현장 경력은 상위 자격(기사·기능장)의 응시 요건이 된다. 자격을 더 따는 것보다 먼저 현장에서 '어떤 설비, 어떤 물질'을 다루는지 보는 것이 진로를 정하는 데 도움이 된다.</span></div>
      <div class="step"><b>용접기사 · 산업안전기사 · 소방설비산업기사(기계)</b><span class="small muted">용접기사는 지금 주축을 한 단계 더 올리는 길이고, 산업안전기사·소방설비산업기사는 안전 쪽으로 무게를 둘 때. 지금 공부하는 화재·소화 원리가 그대로 쓰인다.</span></div>
      <div class="step"><b>가스기능사 → 가스산업기사</b><span class="small muted">플랜트 설비 쪽으로 무게를 둘 때. 용접·위험물과 가장 궁합이 좋다.</span></div>
      <div class="step"><b>위험물기능장</b><span class="small muted">위험물 분야의 최상위. 산업기사 취득 후 실무 경력이 필요하다. 원리를 깊이 이해해 두면 여기서 크게 유리하다.</span></div>
    </div>
  </div>
  <div class="card"><h2>왜 '원리'로 공부하는 것이 진로에도 유리한가</h2>
    <p>시험만 보면 암기로도 붙을 수 있다. 하지만 현장에서 "이 탱크에 물을 뿌리면 안 되는 이유"를 아는 사람과 "안 된다고 외운" 사람은 다른 대우를 받는다. 위험물 원리를 제대로 알면 산업안전·소방·가스 자격의 공부 시간이 절반으로 줄고, 무엇보다 <b>현장에서 판단할 수 있는 사람</b>이 된다. 지금 느린 길이 가장 빠른 길이다.</p>
  </div>`;
}

// ---------- 내 기록 ----------
function mine(){
  const pa = progressAll();
  const notes = ALL.filter(p=>S.notes[p.id] && S.notes[p.id].trim());
  main.innerHTML = `<div class="card"><h2>내 기록</h2>
    <div class="stat"><div><b>${CHAPTERS.filter(isCleared).length}</b><span>통과 단원</span></div><div><b>${pa.d}</b><span>설명 가능</span></div><div><b>${ALL.filter(p=>S.status[p.id]==="read").length}</b><span>읽음</span></div><div><b>${notes.length}</b><span>메모 쓴 원리</span></div><div><b>${Object.values(S.cards).filter(x=>x.last==="ok").length}/${ALLCARDS.length}</b><span>숫자 카드 알았다</span></div></div>
    <p class="small muted">기록은 이 기기의 브라우저에만 저장된다. 다른 기기로 옮기거나 보관하려면 내보내기를 쓴다.</p>
    <div class="row"><button class="btn primary" onclick="exportNotes()">내 원리책 내보내기 (.md)</button><button class="btn" onclick="importNotes()">가져오기</button><button class="btn ghost" onclick="resetAll()">전체 초기화</button></div>
    <input type="file" id="impfile" accept=".json,.md,.txt" style="display:none">
  </div>` +
  `<div class="card"><h2>단원별 통과 시험 기록</h2>${CHAPTERS.map(c=>`<div class="ptitle"><span class="pid">${c.id}</span> ${esc(c.title)} <span class="muted small">— ${S.exam[c.id]?`최고 ${S.exam[c.id].right}/${S.exam[c.id].n}`:"미응시"}${isCleared(c)?" · 통과":""}</span></div>`).join("")}</div>` +
  (notes.length? `<div class="card"><h2>내 말로 쓴 원리</h2>${notes.map(p=>`<div class="sec"><div class="lab"><a href="#book/${p.id}">${p.id} ${esc(p.title)}</a></div><div style="white-space:pre-wrap;font-size:15px">${esc(S.notes[p.id])}</div></div>`).join("")}</div>` : `<div class="card muted small">아직 쓴 메모가 없다. 원리책에서 원리 하나를 읽고 내 말로 써 보자.</div>`);
}
function exportNotes(){
  let md = `# 유빈의 원리책 — 위험물산업기사\n\n내보낸 날짜: ${new Date().toLocaleDateString("ko-KR")}\n\n`;
  CHAPTERS.forEach(c=>{ md += `## ${c.id}. ${c.title}${isCleared(c)?" ✅ 통과":""}\n\n`; c.principles.forEach(p=>{ const st=S.status[p.id]; md += `### ${p.id} ${p.title} ${st==="done"?"✅ 설명 가능":st==="read"?"👀 읽음":""}\n\n`; if(S.notes[p.id]) md += S.notes[p.id].trim()+"\n\n"; }); });
  md += `\n<!-- yubin-data ${JSON.stringify(S)} -->\n`;
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"})); a.download=`유빈의_원리책_${new Date().toISOString().slice(0,10)}.md`; a.click(); toast("내보냈다");
}
function importNotes(){
  const inp=document.getElementById("impfile"); inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ let txt=r.result; const m=txt.match(/<!-- yubin-data (.*?) -->/s); const data=JSON.parse(m?m[1]:txt); if(!data.status||!data.notes) throw 0; S=Object.assign(S,data); S.pass=S.pass||{}; S.exam=S.exam||{}; S.cards=S.cards||{}; S.numq=S.numq||{done:0,right:0}; save(); toast("가져왔다"); mine(); }catch(e){ toast("파일을 읽지 못했다"); } }; r.readAsText(f); }; inp.click();
}
function resetAll(){ if(!confirm("모든 진도·메모·통과 기록을 지울까?")) return; S={ status:{}, notes:{}, pass:{}, exam:{}, cards:{}, numq:{done:0,right:0}, quiz:{done:0,principleRight:0,answerRight:0,seen:{}} }; save(); mine(); toast("초기화했다"); }

route();
</script>
